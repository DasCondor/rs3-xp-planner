services:
  planner:
    build: .
    image: rs3-xp-planner
    container_name: rs3-xp-planner
    restart: unless-stopped
    environment:
      # Both come from .env next to this file (see .env.example).
      RSXP_CONTACT: ${RSXP_CONTACT:?copy .env.example to .env and set RSXP_CONTACT}
      RSXP_PLAYERS: ${RSXP_PLAYERS:-}
      # Extra host names the page may be opened as (see the README before opening it up).
      RSXP_HOSTS: ${RSXP_HOSTS:-}
    ports:
      # The dashboard has no login, so it's only reachable from this machine.
      # Change to "8765:8765" and set RSXP_HOSTS to open it to your network.
      - "127.0.0.1:8765:8765"
    volumes:
      - rsxp-data:/data
    # Locked down: read-only image, no extra privileges, small limits. Only /data is writable.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64

volumes:
  rsxp-data:
