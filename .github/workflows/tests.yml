name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # oldest supported and the current release
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests
      - name: Syntax-check the dashboard scripts
        run: node --check rsxp/static/app.js && node --check rsxp/static/theme.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t rs3-xp-planner .
      - name: Start container (no players, so it never calls Jagex)
        run: docker run -d --name planner -p 8765:8765 -e RSXP_CONTACT=ci-smoke-test rs3-xp-planner
      - name: Wait for the dashboard
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8765/api/players >/dev/null; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:8765/api/players
          curl -fs http://127.0.0.1:8765/ | grep -q "rs3 xp planner"
          for f in app.css app.js theme.js logo.svg; do curl -fs -o /dev/null "http://127.0.0.1:8765/$f"; done
          docker exec planner python -m rsxp --help >/dev/null
      - name: Logs
        if: always()
        run: docker logs planner
